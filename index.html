<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dreamsapi Prompt Library</title>
    <meta name="description" content="수업을 위한 프롬프트 아카이브">
    <link rel="stylesheet" href="./style.css?v=20260702-28">
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <button class="icon-button sidebar-open" id="openSidebar" type="button" aria-label="섹션 열기">
          <span></span>
          <span></span>
          <span></span>
        </button>

        <div class="brand-block"><div class="brand-avatar"><img src="https://drive.google.com/thumbnail?id=1UGMBieHHp_7s83vh635MD5U09WrW84u-&sz=w240" alt="Dreamsapi 캐릭터"></div><p class="eyebrow">Dreamsapi</p><h1><span>Prompt</span> Library</h1><p>수업을 위한 프롬프트 아카이브</p><div class="library-graphic" aria-hidden="true"><span></span><span></span><span></span></div></div>

        <div class="header-controls" aria-label="검색과 화면 설정">
          <button class="search-button" id="searchButton" type="button">프롬프트 찾기</button>
          <label class="field search-field" for="searchInput">
            <span class="sr-only">검색어</span>
            <input id="searchInput" type="search" placeholder="제목이나 설명 검색" aria-label="프롬프트 검색어">
          </label>

          <button class="theme-toggle" id="themeToggle" type="button" aria-label="다크 모드 켜기" aria-pressed="false">
            <span class="toggle-track">
              <span class="toggle-thumb"></span>
            </span>
            <span class="theme-label">다크</span>
          </button>
        </div>
      </header>

      <div class="workspace">
        <aside class="section-sidebar" id="sectionSidebar" aria-label="섹션">
          <div class="course-row" aria-label="과정 선택"><button class="course-button" type="button" aria-hidden="true">과정명</button><label class="field course-field" for="courseSelect"><span class="sr-only">과정명 선택</span><select id="courseSelect" aria-label="과정명 선택"></select></label></div>
          <div class="sidebar-head">
            <div>
              <p class="eyebrow">Course Menu</p>
              <h2 id="courseMenuTitle">과정 메뉴</h2>
            </div>
            <button class="text-button sidebar-close" id="closeSidebar" type="button">닫기</button>
          </div>
          <nav class="section-list" id="sectionList"></nav>
        </aside>

        <div class="sidebar-resizer" id="sidebarResizer" role="separator" aria-label="왼쪽 영역 폭 조절" aria-orientation="vertical" tabindex="0"></div>

        <main class="prompt-area" id="mainContent" tabindex="-1">
          <div class="content-frame">
            <div class="list-head">
              <div class="title-box section-title-box">
                <p class="eyebrow" id="courseKicker">과정</p>
                <h2 id="sectionTitle">프롬프트</h2>
                <p id="resultCount" class="result-count">0개</p>
              </div>
            </div>

            <div class="state-box" id="loadingState">
              <span class="loader"></span>
              <p>데이터를 불러오는 중입니다</p>
            </div>

            <div class="state-box is-hidden" id="emptyState">
              <h3>결과가 없습니다</h3>
              <p>과정을 선택하면 왼쪽에 섹션이 보입니다.</p>
            </div>

            <div class="state-box is-hidden" id="errorState">
              <h3>데이터를 불러오지 못했어요</h3>
              <p id="errorMessage">구글시트 공유 설정과 탭 주소를 확인해 주세요.</p>
            </div>

            <div class="prompt-list" id="promptList" aria-live="polite"></div>
          </div>
        </main>

        <div class="panel-resizer" id="panelResizer" role="separator" aria-label="상세 영역 폭 조절" aria-orientation="vertical" tabindex="0"></div>

        <section class="detail-panel" id="detailPanel" aria-label="프롬프트 상세" aria-hidden="true">
          <div class="detail-empty" id="detailEmpty">
            <p class="eyebrow">Detail</p>
            <h2>프롬프트를 누르면 자세히 볼 수 있습니다</h2>
            <p>수업 전에 필요한 프롬프트를 고르고 바로 복사해 사용하세요.</p>
          </div>

          <article class="detail-content is-hidden" id="detailContent">
            <div class="detail-top">
              <div class="title-box prompt-title-box">
                <p class="eyebrow">Prompt</p>
                <h2 id="detailTitle"></h2>
                <button class="text-button" id="closeDetail" type="button">닫기</button>
              </div>
            </div>

            <p class="detail-desc" id="detailDesc"></p>
            <div class="tag-row" id="detailTags"></div>
            <div class="representative-detail is-hidden" id="detailRepresentative">대표 실습</div>

            <div class="prompt-document" id="detailPrompt"></div>

            <button class="primary-button" id="copyButton" type="button">프롬프트 복사</button>
          </article>
        </section>
      </div>
    </div>

    <div class="mobile-backdrop" id="mobileBackdrop"></div>
    <div class="toast" id="toast" role="status" aria-live="polite">프롬프트를 복사했어요</div>

    <script src="./script.js?v=20260702-28"></script>
  </body>
</html>
